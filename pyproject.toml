[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "evolver-controller"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["zstandard==0.25.0", "PyYAML>=6"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.8", "pytest-cov>=6"]
tui = ["textual>=0.89,<2", "jsonschema>=4.18,<5"]
workflow = ["evolver-procedure-runtime==0.1.0"]
[project.scripts]
evoctl = "evolver_controller.cli:main"
evolver-controller = "evolver_controller.service:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
