name: evolver-edge

volumes:
  evolver-edge-operator-runtime:
    name: evolver-edge-operator-runtime
  evolver-edge-hardware-runtime:
    name: evolver-edge-hardware-runtime

services:
  evolver-hardware:
    build:
      context: ../../evolver/evolver-hardware
      dockerfile: Dockerfile
    privileged: true
    network_mode: none
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      EVOLVER_STATE_ROOT: /var/lib/evolver-hardware
      EVOLVER_HARDWARE_SOCKET: /run/evolver-hardware/hardware.sock
    volumes:
      - type: bind
        source: ${EVOLVER_EDGE_HARDWARE_STATE_ROOT:-/var/lib/evolver-hardware}
        target: /var/lib/evolver-hardware
      - type: volume
        source: evolver-edge-hardware-runtime
        target: /run/evolver-hardware
      - type: bind
        source: /dev
        target: /dev
      - type: bind
        source: /run/udev
        target: /run/udev
        read_only: true
    healthcheck:
      test: [CMD, python, -c, "import os,socket; p=os.environ.get('EVOLVER_HARDWARE_SOCKET','/run/evolver-hardware/hardware.sock'); s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect(p); s.close()"]
      interval: 15s
      timeout: 3s
      retries: 3

  evolver-controller:
    build:
      context: ../../evolver/evolver-controller
      dockerfile: Dockerfile
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      evolver-hardware:
        condition: service_healthy
    environment:
      EVOLVER_STATE_ROOT: /var/lib/evolver-controller
      EVOLVER_OPERATOR_SOCKET: /run/evolver-controller/operator.sock
      EVOLVER_HARDWARE_SOCKET: /run/evolver-hardware/hardware.sock
      EVOLVER_SERVER_URL: ${EVOLVER_SERVER_URL:-}
    volumes:
      - type: bind
        source: ${EVOLVER_EDGE_STATE_ROOT:-/var/lib/evolver-controller}
        target: /var/lib/evolver-controller
      - type: volume
        source: evolver-edge-operator-runtime
        target: /run/evolver-controller
      - type: volume
        source: evolver-edge-hardware-runtime
        target: /run/evolver-hardware
    healthcheck:
      test: [CMD, python, -c, "import os,socket; p=os.environ.get('EVOLVER_OPERATOR_SOCKET','/run/evolver-controller/operator.sock'); s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect(p); s.close()"]
      interval: 15s
      timeout: 3s
      retries: 3
