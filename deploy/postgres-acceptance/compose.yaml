name: meta-ball-postgres-acceptance

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meta_webui_acceptance
      POSTGRES_USER: meta_webui_acceptance
      POSTGRES_PASSWORD: meta_webui_acceptance
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U meta_webui_acceptance -d meta_webui_acceptance"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-acceptance-data:/var/lib/postgresql/data

volumes:
  postgres-acceptance-data:
