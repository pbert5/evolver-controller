name: Meta BAL CI
on:
  push:
    branches: [master, api-tui]
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install repository command proxy
        run: |
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/34fe2553192aef5f6ca19944cb52a272a5294c27/install.sh | RTK_VERSION=v0.47.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.8.14'
      - name: Initialize active component pins
        run: rtk git submodule update --init metactl evolver/evolver-server evolver/evolver-controller evolver/evolver-hardware
      - name: Resolve updated workspace lock
        run: rtk tools/check-locks --relock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-lock
          path: uv.lock
      - name: Install Dev Container CLI
        run: rtk npm install --global @devcontainers/cli
      - name: Start supported Server profile
        run: rtk tools/dev-env server up
      - name: Run complete repository test suite in Server profile
        run: rtk tools/dev-env server exec rtk tools/test all
      - name: Run PostgreSQL acceptance suite in Server profile
        run: rtk tools/dev-env server exec rtk tools/test-postgres-acceptance
      - name: Verify generated Navi catalog in Server profile
        run: rtk tools/dev-env server exec rtk tools/generate_navi_cheats --check
      - name: Verify API workbench and discovery regressions
        run: |
          rtk tools/dev-env server exec rtk tools/test evidence metactl metactl/tests/test_api_workbench.py metactl/tests/test_action_api_contract.py metactl/tests/test_metactl.py
          rtk tools/dev-env server exec rtk tools/test evidence server evolver/evolver-server/tests/test_evolver_action_contract.py evolver/evolver-server/tests/test_evolver_control_service.py
      - name: Verify committed lockfile
        run: rtk git diff --exit-code -- uv.lock
