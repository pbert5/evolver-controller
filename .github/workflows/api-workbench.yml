name: API workbench integration
on:
  push:
    branches: [api-tui]
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install repository command proxy
        run: |
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | RTK_VERSION=v0.47.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.14'
      - name: Initialize active component pins
        run: rtk git submodule update --init metactl evolver/evolver-server evolver/evolver-controller evolver/evolver-hardware
      - name: Resolve updated workspace lock
        run: rtk tools/check-locks --relock
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-lock
          path: uv.lock
      - name: Install Dev Container CLI
        run: rtk npm install --global @devcontainers/cli
      - name: Start supported Server profile
        run: rtk tools/dev-env server up
      - name: Verify exact workbench and discovery tests in Server profile
        run: |
          rtk tools/dev-env server exec rtk tools/test evidence metactl metactl/tests/test_api_workbench.py metactl/tests/test_action_api_contract.py metactl/tests/test_metactl.py
          rtk tools/dev-env server exec rtk tools/test evidence server evolver/evolver-server/tests/test_api_workbench_discovery.py evolver/evolver-server/tests/test_evolver_action_contract.py evolver/evolver-server/tests/test_evolver_control_service.py
      - name: Verify committed lockfile
        run: rtk git diff --exit-code -- uv.lock
