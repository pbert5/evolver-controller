# Requirements that cannot be derived solely from pytest collection.
# Action, route, schema, and test-file inventories are generated by tests.
version: 1
reference:
  repository: refference/meta_webui_demo
  commit: 652cc5de7098949c31d71d035f41fbe0499e6ac1
lanes:
  fast: "repo-local unit and contract pytest processes; xdist enabled"
  serial: "all serial/shared-resource-marked tests, one repo process at a time"
  integration: "cross-repository tests with isolated temporary resources"
  simulator: "deterministic edge/controller/hardware simulators; no physical IO"
requirements:
  - id: action-catalog-enrollment
    subsystem: operator-api
    owner: metactl
    invariant: every implemented catalog action has a valid API projection and trusted server adapter
    negative: missing parameters, invalid enums/types, malformed paths, planned actions are unavailable
    automatic: true
  - id: route-classification
    subsystem: server-http
    owner: evolver-server
    invariant: every registered route is action, machine, infrastructure, resource, or explicitly exempt
    negative: unknown route and wrong method are rejected without bypassing authorization
    automatic: true
  - id: auth-boundaries
    subsystem: server-http
    owner: evolver-server
    invariant: operator and machine credentials are distinct and permission checked
    negative: absent, malformed, expired, wrong-purpose, and wrong-permission credentials fail
  - id: generation-revision-fencing
    subsystem: distributed-state
    owner: evolver-server
    invariant: stale controller generations and stale run revisions cannot mutate central intent
    concurrency: duplicate and out-of-order requests are idempotent or rejected
  - id: durable-restart
    subsystem: persistence
    owner: evolver-server
    invariant: enrollment, queues, cursors, telemetry, events, and recovery survive reopen/restart
    negative: partial failure rolls back without acknowledging uncommitted state
  - id: edge-recovery
    subsystem: controller
    owner: evolver-controller
    invariant: edge state, spool, commands, and identity survive restart and central outage
    simulator: true
  - id: hardware-safety
    subsystem: hardware
    owner: evolver-hardware
    invariant: malformed, out-of-range, stale, or unleased commands cannot actuate outputs
    hardware_manual_only: physical devices and firmware flashing are opt-in and excluded
  - id: cli-transport
    subsystem: metactl
    owner: metactl
    invariant: catalog-derived method/path/query/body/auth/output semantics remain aligned
    negative: 400/401/403/404/409/5xx, timeout, refusal, malformed response, and secret redaction
  - id: release-integrity
    subsystem: release
    owner: meta-ball-root
    invariant: immutable manifests record exact source revisions and validated checksums
    negative: missing/wrong artifacts, invalid manifests, failed validators, and partial staging
  - id: schema-validation
    subsystem: linkml
    owner: private-schema
    invariant: every configured authoritative schema parses with resolvable imports and deterministic assembly
    negative: malformed structure, missing references, bad enum/type, and invalid fixtures
    automatic: true
  - id: simulator-lifecycle
    subsystem: composition
    owner: meta-ball-root
    invariant: enrollment-sync-inventory-run-telemetry-command-outage-restart-reconcile is deterministic
    simulator: true
